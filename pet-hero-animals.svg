<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">Friendly pet illustrations</title><desc id="desc">A dog, cat, parrot, rabbit and fish grouped together on a transparent background.</desc>
